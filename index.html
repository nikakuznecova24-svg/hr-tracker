<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>найм · трекер</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6b5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="найм">
<link rel="apple-touch-icon" href="icon-192.png">
<script>try{var _t=localStorage.getItem("hrtrk_theme");if(_t==="light"||_t==="dark")document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8fc;
    --card:#ffffff;
    --ink:#2c2740;
    --ink-soft:#8b84a0;
    --line:#ece8f4;
    --accent:#6b5fa8;
    --accent-soft:#efecf9;
    --ok:#3f9d7a;
    --warn:#c98a3c;
    --bad:#c15c6b;
    --pill-bg:#f1eef8;
    --aura1:rgba(184,166,232,.38);
    --aura2:rgba(245,198,214,.34);
    --aura3:rgba(168,197,232,.30);
    --shadow:0 14px 40px rgba(58,48,92,.11), 0 3px 10px rgba(58,48,92,.055);
    --radius:24px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16141c; --card:#211d2c; --ink:#ece9f4; --ink-soft:#968ead;
      --line:#302b3d; --accent:#b3a6ea; --accent-soft:#2b2540; --pill-bg:#2b2637;
      --aura1:rgba(122,104,180,.30); --aura2:rgba(150,90,110,.24); --aura3:rgba(90,120,165,.24);
      --shadow:0 10px 34px rgba(0,0,0,.42), 0 2px 8px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#16141c; --card:#211d2c; --ink:#ece9f4; --ink-soft:#968ead;
    --line:#302b3d; --accent:#b3a6ea; --accent-soft:#2b2540; --pill-bg:#2b2637;
    --aura1:rgba(122,104,180,.30); --aura2:rgba(150,90,110,.24); --aura3:rgba(90,120,165,.24);
    --shadow:0 10px 34px rgba(0,0,0,.42), 0 2px 8px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    background-image:
      radial-gradient(70vw 46vw at 50% -8%, var(--aura2), transparent 66%),
      radial-gradient(58vw 58vw at 4% 2%, var(--aura1), transparent 60%),
      radial-gradient(52vw 52vw at 100% 12%, var(--aura3), transparent 58%),
      radial-gradient(64vw 64vw at 50% 104%, var(--aura1), transparent 60%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.4;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
  }
  h1,h2,h3{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:700;margin:0;letter-spacing:0}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}

  .top{padding:calc(16px + env(safe-area-inset-top)) 0 6px}
  .top{padding-bottom:10px}
  .top .date{color:var(--ink-soft);font-size:13px}
  .top h1{font-size:26px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
  .top .gear{position:absolute;right:16px;top:calc(18px + env(safe-area-inset-top));width:38px;height:38px;border:none;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
  .top .themeBtn{position:absolute;right:62px;top:calc(18px + env(safe-area-inset-top));width:38px;height:38px;border:none;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .top .themeBtn:active{background:var(--accent-soft)}
  .top-in{position:relative}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin:14px 0}
  .card > h2{font-size:17px;font-weight:700;margin-bottom:2px}
  .card .sub{color:var(--ink-soft);font-size:12.5px;margin-bottom:10px}
  .card.attn{background:linear-gradient(180deg,#fff, #fbf5f6);border:1px solid #f2dfe3}
  .muted{color:var(--ink-soft)}
  .empty{color:var(--ink-soft);font-size:13.5px;padding:8px 2px}

  .row{display:flex;align-items:center;gap:12px;padding:12px 8px;margin:0 -8px;border-top:1px solid var(--line);border-radius:12px}
  .row:first-of-type{border-top:none}
  .row[data-cand]:active,.row[data-fired]:active,.rowcol[data-cand]:active{background:var(--accent-soft)}
  .row .grow{flex:1;min-width:0}
  .row .name{font-weight:500}
  .row .meta{color:var(--ink-soft);font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chev{color:var(--accent);flex:none;font-size:20px;opacity:.6}
  .rowcol{display:flex;flex-direction:column;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
  .rowcol:first-of-type{border-top:none}
  .rowcol .top-line{display:flex;align-items:center;gap:10px}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 10px;border-radius:999px;background:var(--pill-bg);color:var(--ink-soft);white-space:nowrap;font-weight:500}
  .pill.s-new{color:#7f8399}
  .pill.s-nocall{color:#b07a44}
  .pill.s-interview{color:#5f68cc}
  .pill.s-noshow{color:#c0687a}
  .pill.s-think{color:#b1832f}
  .pill.s-med{color:#3f9270}
  .pill.s-refuse-self,.pill.s-refuse-us{color:#b85c70}
  .pill.s-hired{color:#2f9463}

  .mini{display:flex;gap:8px;flex-wrap:wrap}
  .mini button{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:12px;padding:8px 13px;font-size:12.5px;font-weight:500}
  .mini button:active{background:var(--accent-soft)}
  .mini button.warn{color:var(--bad)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips .chip{padding:10px 14px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:13px;font-weight:600;box-shadow:0 1px 3px rgba(60,50,90,.05)}
  .chips .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .chips .chip.s-nocall.on{border-color:#b07a44;color:#b07a44;background:rgba(176,122,68,.12)}
  .chips .chip.s-interview.on{border-color:#5f68cc;color:#5f68cc;background:rgba(95,104,204,.12)}
  .chips .chip.s-noshow.on{border-color:#c0687a;color:#c0687a;background:rgba(192,104,122,.12)}
  .chips .chip.s-think.on{border-color:#b1832f;color:#b1832f;background:rgba(177,131,47,.12)}
  .chips .chip.s-med.on{border-color:#3f9270;color:#3f9270;background:rgba(63,146,112,.12)}
  .chips .chip.s-refuse-self.on,.chips .chip.s-refuse-us.on{border-color:#b85c70;color:#b85c70;background:rgba(184,92,112,.12)}
  .chips .chip.s-hired.on{border-color:#2f9463;color:#2f9463;background:rgba(47,148,99,.12)}
  .chips .chip.rate-yes.on{border-color:#2f9463;color:#2f9463;background:rgba(47,148,99,.12)}
  .chips .chip.rate-maybe.on{border-color:#b1832f;color:#b1832f;background:rgba(177,131,47,.12)}
  .chips .chip.rate-no.on{border-color:#c0687a;color:#c0687a;background:rgba(192,104,122,.12)}

  .cal .day{padding:10px 0;border-top:1px solid var(--line)}
  .cal .day:first-child{border-top:none}
  .cal .dh{font-weight:600;font-size:12.5px;margin-bottom:4px;color:var(--ink)}
  .cal .dh.wk{color:var(--accent)}
  .cal .ev{display:flex;gap:8px;font-size:13px;padding:3px 0}
  .cal .ev .tm{color:var(--ink-soft);flex:none;width:44px}
  .cal .ev.clash .tm{color:var(--bad)}
  .cal .none{color:var(--ink-soft);font-size:12.5px}

  .chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--accent);flex:none;display:flex;align-items:center;justify-content:center;background:var(--card)}
  .chk.on{background:var(--accent);border-color:var(--accent)}
  .chk.on svg{display:block}
  .chk svg{display:none;color:#fff}
  .tasklist{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .tasklist .task{border:none;margin:0;border-radius:14px;background:var(--accent-soft);padding:13px 13px;gap:13px}
  .tasklist .task .grow{font-weight:500;line-height:1.35}
  .tasklist .task.done{background:var(--pill-bg)}
  .tasklist .task.done .chk{border-color:var(--ink-soft)}
  .task.done .grow{color:var(--ink-soft);text-decoration:line-through}

  .fab{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;box-shadow:0 12px 30px rgba(107,95,168,.45);font-size:27px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:40}

  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);background:color-mix(in srgb, var(--card) 82%, transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);display:flex;padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:30}
  .nav button{flex:1;background:none;border:none;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px;font-size:10px;font-weight:600}
  .nav button .ic{width:46px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:999px;transition:background .16s ease}
  .nav button.on{color:var(--accent)}
  .nav button.on .ic{background:var(--accent-soft)}
  .nav button:active .ic{background:var(--accent-soft)}
  .nav svg{width:23px;height:23px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:13px 14px}
  .stat .n{font-family:"Manrope",-apple-system,sans-serif;font-size:26px;font-weight:700;line-height:1}
  .stat .l{color:var(--ink-soft);font-size:12px;margin-top:5px}

  .fn{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .fn .step{display:flex;align-items:center;gap:10px}
  .fn .bar{height:26px;border-radius:8px;background:var(--accent-soft);flex:none;min-width:26px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;font-size:12px;color:var(--accent);font-weight:500}
  .fn .lab{color:var(--ink-soft);font-size:12.5px}

  .scrim{position:fixed;inset:0;background:rgba(38,32,58,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);background-image:radial-gradient(60vw 40vw at 100% 0%, rgba(245,198,214,.30), transparent 60%);border-radius:26px 26px 0 0;z-index:51;transform:translateY(100%);transition:transform .22s ease;padding:8px 16px calc(28px + env(safe-area-inset-bottom))}
  .sheet.on{transform:translateY(0)}
  .sheet .handle{width:38px;height:4px;border-radius:2px;background:#d7d0e6;margin:8px auto 6px}
  .sheet h2{font-size:20px;margin:6px 2px 12px}
  .field{margin:12px 0}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{min-height:74px;resize:vertical}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:11px 8px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink-soft)}
  .seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
  .cond{background:var(--accent-soft);border-radius:15px;padding:4px 12px 12px;margin:12px 0}
  .outcome{background:#e9ecfb;border-radius:15px;padding:12px;margin:12px 0}
  .outcome .lab{font-size:12.5px;color:#5a63c6;margin-bottom:8px}
  .btn{width:100%;padding:14px;border:none;border-radius:15px;background:var(--accent);color:#fff;font-weight:500;margin-top:16px}
  .btn.ghost{background:transparent;color:var(--bad);box-shadow:none;margin-top:8px}
  .btn.soft{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
  .btn.sm{width:auto;padding:9px 16px;margin-top:0;font-size:13px}
  .hist{margin-top:6px}
  .hist .h{display:flex;gap:8px;font-size:12.5px;color:var(--ink-soft);padding:5px 0;border-top:1px solid var(--line)}
  .hist .h:first-child{border-top:none}
  .hist .h b{color:var(--ink);font-weight:500}
  .inline-add{color:var(--accent);font-size:12.5px;background:none;border:none;padding:6px 0}
  .disc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .disc:first-child{border-top:none}
  .disc .dtxt{flex:1;min-width:0}
  details.vac{border-top:1px solid var(--line);padding:8px 0}
  details.vac:first-of-type{border-top:none}
  details.vac summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer}
  details.vac summary::-webkit-details-marker{display:none}
  .tag{font-size:11px;color:var(--ink-soft);background:#f1eef8;border-radius:999px;padding:3px 8px;white-space:nowrap}
  .tag.hot{color:#c15c6b;background:#f6e9ec}
  .brk{color:var(--ink-soft);font-size:12.5px;padding:8px 0 2px 0;line-height:1.75}
  .filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
  .filters button{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:12.5px}
  .filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1}
  .addrow button{flex:none;padding:0 16px;border:none;border-radius:13px;background:var(--accent);color:#fff}
  .search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);outline:none;margin:6px 0}
  .rep{width:100%;min-height:260px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink);font-size:13px;line-height:1.55;white-space:pre-wrap;resize:vertical}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top top-in">
    <div class="date" id="today"></div>
    <h1 id="screenTitle">план на день</h1>
    <button class="themeBtn" id="themeBtn" aria-label="тема"></button>
    <button class="gear" id="gearBtn" aria-label="настройки">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b5fa8" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.2.63.77 1.06 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div id="view"></div>
</div>

<button class="fab" id="fab">+</button>

<nav class="nav" id="nav">
  <button data-s="day" class="on"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v3M16 2.5v3"/><rect x="3.5" y="5" width="17" height="16" rx="3.5"/><path d="M3.5 10h17"/><circle cx="12" cy="15.5" r="1.5" fill="currentColor" stroke="none"/></svg></span>день</button>
  <button data-s="cands"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.7 3.1-6 7-6s7 2.3 7 6"/></svg></span>кандидаты</button>
  <button data-s="vacs"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12.5" rx="2.6"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"/><path d="M3 12.5h18"/></svg></span>вакансии</button>
  <button data-s="fired"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7"/><path d="M18 8l4 4-4 4"/><path d="M22 12H10"/></svg></span>увольнения</button>
  <button data-s="stats"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="12" width="4" height="8" rx="1.4"/><rect x="10" y="7" width="4" height="13" rx="1.4"/><rect x="16" y="14" width="4" height="6" rx="1.4"/></svg></span>сводка</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY = "hrtrk_v1";

  var STATUSES = [
    ["new","новый","s-new"],
    ["nocall","не дозвонились","s-nocall"],
    ["interview","на собеседовании","s-interview"],
    ["noshow","не пришёл на собес","s-noshow"],
    ["think","думает","s-think"],
    ["med","на медкомиссии","s-med"],
    ["refuse-self","отказал сам","s-refuse-self"],
    ["refuse-us","отказали мы","s-refuse-us"],
    ["hired","вышел на работу","s-hired"]
  ];
  function stName(k){ for(var i=0;i<STATUSES.length;i++) if(STATUSES[i][0]===k) return STATUSES[i][1]; return k; }
  function stCls(k){ for(var i=0;i<STATUSES.length;i++) if(STATUSES[i][0]===k) return STATUSES[i][2]; return "s-new"; }
  var DEAD = {"refuse-self":1,"refuse-us":1,"hired":1};

  var DEF_REJECT = ["не устроила зарплата","далеко ездить","нашёл другую работу","не прошёл медкомиссию","не вышел на связь","не пришёл на собеседование","не устроил график"];
  var DEF_DISMISS = ["по собственному желанию","не прошёл испытательный срок","нарушения дисциплины","переезд","не устроила зарплата","конфликт в коллективе","по здоровью"];
  var DEF_TEMPLATES = [
    {name:"приглашение на собеседование", text:"здравствуйте, {имя}! приглашаем вас на собеседование {дата} в {время} на позицию «{вакансия}». подтвердите, пожалуйста, что придёте."},
    {name:"напоминание о собеседовании", text:"здравствуйте, {имя}! напоминаем про собеседование завтра в {время}. будем ждать вас."},
    {name:"приглашение на медкомиссию", text:"здравствуйте, {имя}! нужно пройти медкомиссию {дата}. адрес и список врачей пришлю отдельным сообщением."},
    {name:"отказ после собеседования", text:"здравствуйте, {имя}! спасибо, что нашли время на встречу. по итогу мы решили остановиться на другом кандидате. желаем удачи в поиске работы."},
    {name:"не дозвонились", text:"здравствуйте, {имя}! звонили вам по поводу вакансии «{вакансия}», не смогли дозвониться. напишите, когда вам удобно поговорить."}
  ];

  var state = load();

  function load(){
    var s;
    try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){ s = null; }
    if(!s || typeof s!=="object") s = {};
    s.candidates = s.candidates || [];
    s.vacancies  = s.vacancies  || [];
    s.dismissals = s.dismissals || [];
    s.tasks      = s.tasks      || [];
    s.refs       = s.refs       || {};
    s.refs.reject    = s.refs.reject    || DEF_REJECT.slice();
    s.refs.dismiss   = s.refs.dismiss   || DEF_DISMISS.slice();
    s.refs.templates = s.refs.templates || DEF_TEMPLATES.map(function(t){ return {name:t.name, text:t.text}; });
    return s;
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ alert("не удалось сохранить — возможно, память браузера переполнена"); } }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function isoToday(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function isoShift(days){ var d=new Date(); d.setDate(d.getDate()+days); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function ruDate(iso){ if(!iso) return ""; var p=iso.split("-"); if(p.length<3) return iso; return p[2]+"."+p[1]+"."+p[0]; }
  function ruShort(iso){ if(!iso) return ""; var p=iso.split("-"); return p[2]+"."+p[1]; }
  function monthKey(iso){ if(!iso) return ""; var p=iso.split("-"); return p[0]+"-"+p[1]; }
  var MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
  function monthName(iso){ if(!iso) return ""; var p=iso.split("-"); return MONTHS[(parseInt(p[1],10)||1)-1]+" "+p[0]; }
  function daysBetween(a,b){ if(!a||!b) return null; return Math.round((new Date(b) - new Date(a)) / 86400000); }
  function weekAhead(iso){ var d = daysBetween(isoToday(), iso); return d!==null && d>=0 && d<=6; }
  function lastMove(c){ if(c.history && c.history.length) return c.history[c.history.length-1].date; return c.createdAt || isoToday(); }
  function inLastDays(iso, days){ var d = daysBetween(iso, isoToday()); return d!==null && d>=0 && d<days; }
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 1800);
  }

  function getTheme(){ try{ return localStorage.getItem("hrtrk_theme") || "auto"; }catch(e){ return "auto"; } }
  function effectiveTheme(){
    var t = getTheme();
    if(t==="light" || t==="dark") return t;
    try{ return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }catch(e){ return "light"; }
  }
  function setTheme(v){
    try{
      if(v==="auto"){ localStorage.removeItem("hrtrk_theme"); document.documentElement.removeAttribute("data-theme"); }
      else { localStorage.setItem("hrtrk_theme", v); document.documentElement.setAttribute("data-theme", v); }
    }catch(e){}
    updateThemeBtn();
  }
  var SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function updateThemeBtn(){
    var b = document.getElementById("themeBtn");
    if(b) b.innerHTML = (effectiveTheme()==="dark") ? SUN : MOON;
  }

  var screen = "day";
  var TITLES = { day:"план на день", cands:"кандидаты", vacs:"вакансии", fired:"увольнения", stats:"сводка" };
  var candFilter = "all";
  var candSearch = "";

  function setScreen(s){
    screen = s;
    document.getElementById("screenTitle").textContent = TITLES[s];
    var b = document.querySelectorAll("#nav button");
    for(var i=0;i<b.length;i++) b[i].classList.toggle("on", b[i].getAttribute("data-s")===s);
    document.getElementById("fab").style.display = (s==="stats") ? "none" : "flex";
    render();
    window.scrollTo(0,0);
  }
  function render(){
    var v = document.getElementById("view");
    if(screen==="day") v.innerHTML = viewDay();
    else if(screen==="cands") v.innerHTML = viewCands();
    else if(screen==="vacs") v.innerHTML = viewVacs();
    else if(screen==="fired") v.innerHTML = viewFired();
    else if(screen==="stats") v.innerHTML = viewStats();
    bindView();
  }

  function ratingName(r){ return r==="yes"?"подходит":r==="maybe"?"сомнения":r==="no"?"не подходит":""; }

  // ---- quick status change with history ----
  function condExtra(c, st){
    st = st || c.status; var m = c.meta||{};
    if(st==="interview") return [ruShort(m.interviewDate), m.interviewTime].filter(Boolean).join(" ");
    if(st==="med") return m.medDate ? ruShort(m.medDate) : "";
    if(st==="think") return m.thinkUntil ? ("до "+ruShort(m.thinkUntil)) : "";
    if(st==="nocall") return m.callbackDate ? ("перезвон "+ruShort(m.callbackDate)) : "";
    if(st==="hired") return m.startDate ? ("с "+ruShort(m.startDate)) : "";
    if(st==="refuse-self"||st==="refuse-us") return m.reason || "";
    return "";
  }
  function quickStatus(id, ns, patch){
    var c = findCand(id); if(!c) return;
    c.meta = c.meta || {};
    if(patch) for(var k in patch) c.meta[k] = patch[k];
    if(c.status !== ns){
      c.history = c.history || [];
      c.history.push({ date:isoToday(), to:ns, extra:condExtra(c, ns) });
      c.status = ns;
    }
    save(); render();
  }

  // ================= DAY =================
  function viewDay(){
    var t = isoToday(), tm = isoShift(1);
    var h = "";

    var hintSeen; try{ hintSeen = localStorage.getItem("hrtrk_hint"); }catch(e){}
    if(!hintSeen){
      h += '<div class="card" id="hintCard"><h2>как пользоваться</h2>'+
           '<div class="brk" style="padding-left:0">'+
           '• круглая кнопка «+» справа внизу — добавить кандидата, вакансию или запись<br>'+
           '• нажми на строку с человеком — откроется карточка<br>'+
           '• смахни строку влево — удалить (спросит подтверждение)<br>'+
           '• в карточке двигай статус кнопками-плашками, поля появятся сами<br>'+
           '• солнце/луна вверху справа — светлая или тёмная тема<br>'+
           '• внизу — переключение между разделами'+
           '</div><button class="btn sm" id="hintOk" style="margin-top:10px">понятно</button></div>';
    }

    // ---- требует внимания ----
    var attn = [];
    state.candidates.forEach(function(c){
      var m = c.meta || {};
      if(c.status==="interview" && m.interviewDate===t && !m.confirmed)
        attn.push({ c:c, txt:"собес сегодня"+(m.interviewTime?" в "+m.interviewTime:"")+", не подтверждён", acts:[["conf","подтвердить"],["noshow warn","не пришёл"]] });
      if((c.status==="nocall"||c.status==="think") && m.callbackDate && m.callbackDate < t)
        attn.push({ c:c, txt:"просрочен звонок — "+ruShort(m.callbackDate), acts:[["snooze","перезвонить завтра"],["open","открыть"]] });
      if(c.status==="med" && m.medDate && (m.medDate===t || m.medDate===tm))
        attn.push({ c:c, txt:"медкомиссия "+(m.medDate===t?"сегодня":"завтра"), acts:[["hired","вышел на работу"],["open","открыть"]] });
      if(!DEAD[c.status] && c.status!=="hired"){
        var d = daysBetween(lastMove(c), t);
        if(d!==null && d>3) attn.push({ c:c, txt:"без движения "+d+" дн. · "+stName(c.status), acts:[["open","открыть"]] });
      }
    });
    if(attn.length){
      h += '<div class="card attn"><h2>требует внимания</h2><div class="sub">'+attn.length+' пунктов</div>';
      attn.forEach(function(a){
        var btns = a.acts.map(function(x){
          var parts = x[0].split(" ");
          var cls = parts.indexOf("warn")>-1 ? ' class="warn"' : '';
          return '<button'+cls+' data-act="'+parts[0]+'" data-id="'+a.c.id+'">'+esc(x[1])+'</button>';
        }).join("");
        h += '<div class="rowcol" data-cand="'+a.c.id+'"><div class="top-line"><div class="grow"><div class="name">'+esc(a.c.fio||"без имени")+'</div>'+
             '<div class="meta">'+esc(a.txt)+'</div></div><span class="chev">›</span></div><div class="mini">'+ btns +'</div></div>';
      });
      h += '</div>';
    }

    var todayTasks = state.tasks.filter(function(x){ return !x.done && (!x.date || x.date<=t); });
    var doneToday  = state.tasks.filter(function(x){ return x.done; });
    h += '<div class="card"><h2>задачи на сегодня</h2><div class="sub">'+ todayTasks.length +' активных · '+ doneToday.length +' сделано</div>';
    h += '<div class="addrow"><input id="taskInput" placeholder="новая задача" maxlength="140"><button id="taskAdd">+</button></div>';
    if(!todayTasks.length && !doneToday.length) h += '<div class="empty">пока пусто</div>';
    else {
      h += '<div class="tasklist">';
      todayTasks.forEach(function(x){ h += taskRow(x); });
      doneToday.forEach(function(x){ h += taskRow(x); });
      h += '</div>';
    }
    h += '</div>';

    var interviews = state.candidates.filter(function(c){ return c.status==="interview" && c.meta && c.meta.interviewDate===t; })
      .sort(function(a,b){ return (a.meta.interviewTime||"").localeCompare(b.meta.interviewTime||""); });
    h += '<div class="card"><h2>сегодня на собеседовании</h2><div class="sub">'+ interviews.length +' чел.</div>';
    if(!interviews.length) h += '<div class="empty">на сегодня никто не&nbsp;назначен</div>';
    interviews.forEach(function(c){
      h += '<div class="rowcol" data-cand="'+c.id+'"><div class="top-line"><div class="grow"><div class="name">'+esc(c.fio||"без имени")+'</div>'+
           '<div class="meta">'+esc(vacTitle(c.vacancy)||"вакансия не&nbsp;указана")+'</div></div>'+
           '<div class="pill">'+ (c.meta&&c.meta.interviewTime ? esc(c.meta.interviewTime) : "время?") +'</div><span class="chev">›</span></div>'+
           '<div class="mini"><button data-act="passed" data-id="'+c.id+'">собес прошёл</button><button class="warn" data-act="noshow" data-id="'+c.id+'">не пришёл</button></div></div>';
    });
    h += '</div>';

    // ---- собеседования на неделю ----
    h += '<div class="card cal"><h2>собеседования на неделю</h2>';
    var anyWeek = false;
    for(var wd=0; wd<7; wd++){
      var day = isoShift(wd);
      var ints = state.candidates.filter(function(c){ return c.status==="interview" && c.meta && c.meta.interviewDate===day; })
        .sort(function(a,b){ return (a.meta.interviewTime||"").localeCompare(b.meta.interviewTime||""); });
      var meds = state.candidates.filter(function(c){ return c.status==="med" && c.meta && c.meta.medDate===day; });
      if(!ints.length && !meds.length) continue;
      anyWeek = true;
      var tc = {};
      ints.forEach(function(c){ var tm=c.meta.interviewTime; if(tm) tc[tm]=(tc[tm]||0)+1; });
      var dObj = new Date(day);
      var wn = ["вс","пн","вт","ср","чт","пт","сб"][dObj.getDay()];
      h += '<div class="day"><div class="dh'+(wd===0?" wk":"")+'">'+wn+' '+ruShort(day)+(wd===0?' · сегодня':'')+'</div>';
      ints.forEach(function(c){
        var clash = c.meta.interviewTime && tc[c.meta.interviewTime]>1;
        h += '<div class="ev'+(clash?" clash":"")+'" data-cand="'+c.id+'"><span class="tm">'+esc(c.meta.interviewTime||"—")+'</span><span class="grow">'+esc(c.fio||"без имени")+(clash?" · наложение":"")+'</span></div>';
      });
      meds.forEach(function(c){
        h += '<div class="ev" data-cand="'+c.id+'"><span class="tm">мк</span><span class="grow">'+esc(c.fio||"без имени")+'</span></div>';
      });
      h += '</div>';
    }
    if(!anyWeek) h += '<div class="empty">на ближайшую неделю встреч нет</div>';
    h += '</div>';

    var toCall = state.candidates.filter(function(c){
      if(c.status==="nocall") return true;
      if(c.status==="think" && c.meta && c.meta.callbackDate && c.meta.callbackDate<=t) return true;
      return false;
    });
    h += '<div class="card"><h2>обзвонить</h2><div class="sub">не дозвонились или пора&nbsp;перезвонить</div>';
    if(!toCall.length) h += '<div class="empty">никого</div>';
    toCall.forEach(function(c){
      h += '<div class="row" data-cand="'+c.id+'"><div class="grow"><div class="name">'+esc(c.fio||"без имени")+'</div>'+
           '<div class="meta">'+esc(c.phone||"телефон?")+' · '+esc(vacTitle(c.vacancy)||"—")+'</div></div>'+
           '<span class="pill '+stCls(c.status)+'">'+stName(c.status)+'</span><span class="chev">›</span></div>';
    });
    h += '</div>';
    return h;
  }
  function taskRow(x){
    return '<div class="row task '+(x.done?"done":"")+'" data-task="'+x.id+'">'+
      '<button class="chk '+(x.done?"on":"")+'" data-toggle="'+x.id+'"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></button>'+
      '<div class="grow">'+esc(x.text)+ (x.date && x.date<isoToday() && !x.done ? ' <span class="muted">· просрочено</span>':'') +'</div>'+
      '<button class="chev" data-deltask="'+x.id+'" style="background:none;border:none;font-size:18px">×</button></div>';
  }

  // ================= CANDIDATES =================
  function viewCands(){
    var h = '<input class="search" id="candSearch" placeholder="поиск по имени или телефону" value="'+esc(candSearch)+'">';
    h += '<div class="filters" id="cf">';
    h += fbtn("all","все", state.candidates.length);
    h += fbtn("__stuck","давно без движения", state.candidates.filter(function(c){ var d=daysBetween(lastMove(c),isoToday()); return !DEAD[c.status] && c.status!=="hired" && d!==null && d>3; }).length);
    STATUSES.forEach(function(s){
      var n = state.candidates.filter(function(c){return c.status===s[0];}).length;
      if(n) h += fbtn(s[0], s[1], n);
    });
    h += '</div>';

    var list = state.candidates.slice();
    var q = candSearch.trim().toLowerCase();
    if(q) list = list.filter(function(c){ return (c.fio||"").toLowerCase().indexOf(q)>-1 || (c.phone||"").toLowerCase().indexOf(q)>-1; });
    if(candFilter==="__stuck"){
      list = list.filter(function(c){ var d=daysBetween(lastMove(c),isoToday()); return !DEAD[c.status] && c.status!=="hired" && d!==null && d>3; });
      list.sort(function(a,b){ return daysBetween(lastMove(b),isoToday()) - daysBetween(lastMove(a),isoToday()); });
    } else {
      if(candFilter!=="all") list = list.filter(function(c){ return c.status===candFilter; });
      list.sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
    }

    h += '<div class="card">';
    if(!list.length) h += '<div class="empty">'+(q?"ничего не&nbsp;найдено":"нет кандидатов — нажми&nbsp;«+»")+'</div>';
    list.forEach(function(c){
      var extra = candExtra(c);
      var stuckDays = (candFilter==="__stuck") ? daysBetween(lastMove(c),isoToday())+" дн." : "";
      h += '<div class="row" data-cand="'+c.id+'"><div class="grow"><div class="name">'+esc(c.fio||"без имени")+'</div>'+
           '<div class="meta">'+esc(vacTitle(c.vacancy)||"вакансия не&nbsp;указана")+ (extra? ' · '+esc(extra):'') + (stuckDays? ' · '+stuckDays:'') +'</div></div>'+
           '<span class="pill '+stCls(c.status)+'">'+stName(c.status)+'</span><span class="chev">›</span></div>';
    });
    h += '</div>';
    return h;
  }
  function fbtn(k,label,n){ return '<button data-f="'+k+'" class="'+(candFilter===k?"on":"")+'">'+label+' '+n+'</button>'; }
  function candExtra(c){
    var m = c.meta||{};
    if(c.status==="interview") return (m.interviewDate?ruShort(m.interviewDate):"") + (m.interviewTime?" "+m.interviewTime:"");
    if(c.status==="med") return m.medDate?("мк "+ruShort(m.medDate)):"";
    if(c.status==="think") return m.thinkUntil?("до "+ruShort(m.thinkUntil)):"";
    if(c.status==="nocall") return m.callbackDate?("перезвон "+ruShort(m.callbackDate)):"";
    if(c.status==="hired") return m.startDate?("с "+ruShort(m.startDate)):"";
    if(c.status==="refuse-self"||c.status==="refuse-us") return m.reason||"";
    return "";
  }

  // ================= VACANCIES =================
  function vacTitle(id){ var v = findVac(id); return v?v.title:""; }
  function findVac(id){ for(var i=0;i<state.vacancies.length;i++) if(state.vacancies[i].id===id) return state.vacancies[i]; return null; }

  function viewVacs(){
    var h = '<div class="card"><h2>вакансии</h2><div class="sub">сколько нужно людей, кто&nbsp;в&nbsp;работе, где&nbsp;застревают</div>';
    if(!state.vacancies.length) h += '<div class="empty">нет вакансий — нажми&nbsp;«+»</div>';
    state.vacancies.forEach(function(v){
      var mine = state.candidates.filter(function(c){ return c.vacancy===v.id; });
      var active = mine.filter(function(c){ return !DEAD[c.status]; });
      var hiredC = mine.filter(function(c){ return c.status==="hired"; });
      var need = Math.max(0,(v.need||0));
      var left = need - hiredC.length;
      var dToDl = v.deadline ? daysBetween(isoToday(), v.deadline) : null;
      var hot = (dToDl!==null && dToDl>=0 && dToDl<=14 && left>0);

      // avg time to hire
      var avg = null, sum=0, cnt=0;
      hiredC.forEach(function(c){
        var start = (c.meta && c.meta.startDate) || lastMove(c);
        var dd = daysBetween(c.createdAt || start, start);
        if(dd!==null && dd>=0){ sum+=dd; cnt++; }
      });
      if(cnt) avg = Math.round(sum/cnt);

      var by = {};
      mine.forEach(function(c){ by[c.status]=(by[c.status]||0)+1; });
      var stageOrder = ["nocall","interview","noshow","think","med"];
      var bottleneck = null, bmax = 0;
      stageOrder.forEach(function(k){ if((by[k]||0) > bmax){ bmax = by[k]; bottleneck = k; } });
      var shortfall = Math.max(0, left - active.length);

      h += '<details class="vac"><summary><div class="grow"><div class="name">'+esc(v.title||"без названия")+'</div>'+
           '<div class="meta">нужно '+need+' · вышло '+hiredC.length+' · в работе '+active.length+'</div></div>'+
           (hot ? '<span class="tag hot">горит · '+ruShort(v.deadline)+'</span>' : '<span class="tag">'+ (left>0 ? "ещё "+left : "закрыта") +'</span>')+
           '<span class="chev">›</span></summary>';
      var parts = [];
      if(avg!==null) parts.push("средний срок закрытия: "+avg+" дн.");
      if(bottleneck && bmax>0) parts.push("чаще застревают: "+stName(bottleneck)+" ("+bmax+")");
      if(shortfall>0) parts.push("не хватает в работе: "+shortfall+" — добавь кандидатов");
      if(v.deadline) parts.push("дедлайн: "+ruDate(v.deadline)+(dToDl!==null? " ("+(dToDl>=0?"через "+dToDl+" дн.":"просрочен")+")":""));
      var order = ["nocall","interview","noshow","think","med","refuse-self","refuse-us","hired","new"];
      var brk = [];
      order.forEach(function(k){ if(by[k]) brk.push(stName(k)+" — "+by[k]); });
      h += '<div class="brk">'+ parts.join("<br>") + (parts.length?'<br>':'') +
           '<span class="muted">'+ (brk.length? brk.join(" · ") : "кандидатов пока нет") +'</span>'+
           '<br><button class="inline-add" data-editvac="'+v.id+'">изменить вакансию</button></div></details>';
    });
    h += '</div>';
    return h;
  }

  // ================= DISMISSALS =================
  function viewFired(){
    var mk = monthKey(isoToday());
    var thisMonth = state.dismissals.filter(function(d){ return monthKey(d.date)===mk; });
    var reasons = {};
    state.dismissals.forEach(function(d){ if(d.reason) reasons[d.reason]=(reasons[d.reason]||0)+1; });
    var topR = Object.keys(reasons).sort(function(a,b){return reasons[b]-reasons[a];}).slice(0,3);
    // by month for last 6
    var months = {};
    state.dismissals.forEach(function(d){ var k=monthKey(d.date); if(k) months[k]=(months[k]||0)+1; });
    var mkeys = Object.keys(months).sort().slice(-6);
    var mmax = Math.max.apply(null, mkeys.map(function(k){return months[k];}).concat([1]));

    var h = '<div class="card"><h2>за этот месяц</h2><div class="sub">'+monthName(isoToday())+'</div>';
    h += '<div class="row"><div class="grow name">уволено</div><div class="pill">'+thisMonth.length+'</div></div>';
    if(mkeys.length){
      h += '<div class="sub" style="margin-top:12px">по месяцам</div><div class="fn">';
      mkeys.forEach(function(k){
        var w = 26 + Math.round((months[k]/mmax)*210);
        var p = k.split("-");
        h += '<div class="step"><div class="bar" style="width:'+w+'px">'+months[k]+'</div><div class="lab">'+MONTHS[(parseInt(p[1],10)||1)-1]+'</div></div>';
      });
      h += '</div>';
    }
    if(topR.length){
      h += '<div class="sub" style="margin-top:12px">частые причины за всё время</div>';
      topR.forEach(function(r){ h += '<div class="disc"><span class="dtxt">'+esc(r)+'</span><span class="muted">'+reasons[r]+'</span></div>'; });
    }
    h += '</div>';

    var list = state.dismissals.slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
    h += '<div class="card"><h2>список</h2>';
    if(!list.length) h += '<div class="empty">пока никого — нажми&nbsp;«+»</div>';
    list.forEach(function(d){
      h += '<div class="row" data-fired="'+d.id+'"><div class="grow"><div class="name">'+esc(d.fio||"без имени")+'</div>'+

           '<div class="meta">'+ruShort(d.date)+'</div><span class="chev">›</span></div>';
    });
    h += '</div>';
    return h;
  }

  // ================= STATS =================
  function viewStats(){
    var t = isoToday(), mk = monthKey(t);
    var C = state.candidates;
    var openVac = state.vacancies.filter(function(v){
      var hired = C.filter(function(c){return c.vacancy===v.id && c.status==="hired";}).length;
      return (v.need||0) - hired > 0;
    });
    var needMore = openVac.reduce(function(a,v){
      var hired = C.filter(function(c){return c.vacancy===v.id && c.status==="hired";}).length;
      return a + Math.max(0,(v.need||0)-hired);
    },0);
    var intToday = C.filter(function(c){return c.status==="interview" && c.meta && c.meta.interviewDate===t;}).length;
    var intWeek  = C.filter(function(c){return c.status==="interview" && c.meta && weekAhead(c.meta.interviewDate);}).length;
    var med = C.filter(function(c){return c.status==="med";}).length;
    var think = C.filter(function(c){return c.status==="think";}).length;
    var nocall = C.filter(function(c){return c.status==="nocall";}).length;
    var hiredMonth = C.filter(function(c){return c.status==="hired" && c.meta && monthKey(c.meta.startDate)===mk;}).length;
    var firedMonth = state.dismissals.filter(function(d){return monthKey(d.date)===mk;}).length;

    var h = '<div class="grid">';
    h += stat(openVac.length, "открытых вакансий");
    h += stat(needMore, "ещё нужно людей");
    h += stat(intToday, "собесов сегодня");
    h += stat(intWeek, "собесов на неделе");
    h += stat(med, "на медкомиссии");
    h += stat(think, "думают");
    h += stat(nocall, "не дозвонились");
    h += stat(hiredMonth, "вышло за месяц");
    h += stat(firedMonth, "уволено за месяц");
    h += '</div>';

    var steps = [["new","новый"],["nocall","не дозвонились"],["interview","на собеседовании"],["med","на медкомиссии"],["hired","вышли на работу"]];
    var counts = steps.map(function(s){ return C.filter(function(c){return c.status===s[0];}).length; });
    var mx = Math.max.apply(null, counts.concat([1]));
    h += '<div class="card"><h2>воронка сейчас</h2><div class="fn">';
    steps.forEach(function(s,i){
      var w = 26 + Math.round((counts[i]/mx) * 220);
      h += '<div class="step"><div class="bar" style="width:'+w+'px">'+counts[i]+'</div><div class="lab">'+s[1]+'</div></div>';
    });
    h += '</div></div>';

    h += '<div class="card"><h2>отчёт</h2><div class="sub">готовый текст, чтобы отправить руководителю</div>'+
         '<div class="mini"><button data-rep="week">за неделю</button><button data-rep="month">за месяц</button></div></div>';

    h += '<div class="card"><h2>данные</h2><div class="sub">хранятся в этом браузере — делай копию</div>'+
         '<button class="btn soft" id="exp">выгрузить копию (файл)</button>'+
         '<button class="btn soft" id="imp" style="margin-top:8px">загрузить из копии</button>'+
         '<input type="file" id="impFile" accept="application/json,.json" style="display:none">'+
         '</div>';
    return h;
  }
  function stat(n,l){ return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }

  // ---- report ----
  function buildReport(mode){
    var C = state.candidates;
    var pred, label;
    if(mode==="week"){ pred = function(iso){ return inLastDays(iso, 7); }; label = "за неделю (последние 7 дней)"; }
    else { pred = function(iso){ return monthKey(iso)===monthKey(isoToday()); }; label = monthName(isoToday()); }

    var assigned = 0, conducted = 0;
    C.forEach(function(c){
      (c.history||[]).forEach(function(hh){
        if(hh.to==="interview" && pred(hh.date)) assigned++;
        if((hh.to==="med"||hh.to==="think"||hh.to==="refuse-us"||hh.to==="hired"||hh.to==="noshow") && pred(hh.date)) conducted++;
      });
    });
    var hired = C.filter(function(c){ return c.status==="hired" && c.meta && pred(c.meta.startDate); }).length;
    var fired = state.dismissals.filter(function(d){ return pred(d.date); }).length;

    var txt = "отчёт по найму — " + label + "\n\n";
    txt += "назначено собеседований: " + assigned + "\n";
    txt += "проведено собеседований: " + conducted + "\n";
    txt += "вышло на работу: " + hired + "\n";
    txt += "уволилось: " + fired + "\n\n";

    txt += "воронка сейчас:\n";
    [["new","новый"],["nocall","не дозвонились"],["interview","на собеседовании"],["med","на медкомиссии"],["hired","вышли на работу"]].forEach(function(s){
      txt += "  " + s[1] + " — " + C.filter(function(c){return c.status===s[0];}).length + "\n";
    });

    var rc = {yes:0,maybe:0,no:0};
    C.forEach(function(c){ if(c.meta && c.meta.rating && rc[c.meta.rating]!=null) rc[c.meta.rating]++; });
    if(rc.yes+rc.maybe+rc.no > 0){
      txt += "\nоценки кандидатов:\n";
      txt += "  подходит — " + rc.yes + "\n  сомнения — " + rc.maybe + "\n  не подходит — " + rc.no + "\n";
    }

    if(state.vacancies.length){
      txt += "\nпо вакансиям:\n";
      state.vacancies.forEach(function(v){
        var mine = C.filter(function(c){return c.vacancy===v.id;});
        var hd = mine.filter(function(c){return c.status==="hired";}).length;
        var act = mine.filter(function(c){return !DEAD[c.status];}).length;
        txt += "  " + (v.title||"без названия") + " — нужно " + (v.need||0) + ", вышло " + hd + ", в работе " + act + "\n";
      });
    }

    var reasons = {};
    C.forEach(function(c){
      (c.history||[]).forEach(function(hh){
        if(hh.to==="refuse-us" && pred(hh.date) && hh.extra) reasons[hh.extra] = (reasons[hh.extra]||0)+1;
      });
    });
    var rk = Object.keys(reasons);
    if(rk.length){
      txt += "\nпричины отказов с нашей стороны:\n";
      rk.sort(function(a,b){return reasons[b]-reasons[a];}).forEach(function(r){ txt += "  " + r + " — " + reasons[r] + "\n"; });
    }
    return txt;
  }
  function openReport(mode){
    var txt = buildReport(mode);
    var h = '<h2>отчёт</h2>';
    h += '<div class="mini" style="margin-bottom:10px"><button data-rmode="week" class="'+(mode==="week"?"":"")+'">за неделю</button><button data-rmode="month">за месяц</button></div>';
    h += '<textarea class="rep" id="repText" readonly>'+esc(txt)+'</textarea>';
    h += '<button class="btn" id="repCopy">скопировать</button>';
    openSheet(h);
    each(sheet.querySelectorAll("[data-rmode]"), function(el){
      el.onclick = function(){ openReport(el.getAttribute("data-rmode")); };
    });
    document.getElementById("repCopy").onclick = function(){ copyText(txt); };
  }
  function copyText(txt){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast("скопировано"); }, function(){ legacyCopy(txt); });
    } else legacyCopy(txt);
  }
  function legacyCopy(txt){
    try{
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position="fixed"; ta.style.left="-9999px";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove(); toast("скопировано");
    }catch(e){ toast("не получилось скопировать"); }
  }

  // ================= BIND =================
  function attachSwipe(el, onDelete){
    var sx=0, sy=0, dx=0, active=false, decided=false;
    el.addEventListener("touchstart", function(e){
      if(e.touches.length!==1) return;
      var tt=e.touches[0]; sx=tt.clientX; sy=tt.clientY; dx=0; active=true; decided=false;
      el.style.transition="none";
    }, {passive:true});
    el.addEventListener("touchmove", function(e){
      if(!active) return;
      var tt=e.touches[0], mx=tt.clientX-sx, my=tt.clientY-sy;
      if(!decided){
        if(Math.abs(mx)<8 && Math.abs(my)<8) return;
        decided=true;
        if(Math.abs(my)>Math.abs(mx)){ active=false; el.style.transform=""; return; }
      }
      dx = Math.max(-104, Math.min(0, mx));
      el.style.transform = "translateX("+dx+"px)";
      el.style.background = dx < -30 ? "rgba(193,92,107,.12)" : "";
    }, {passive:true});
    el.addEventListener("touchend", function(){
      if(!active) return;
      active=false;
      el.style.transition="transform .18s";
      el.style.transform=""; el.style.background="";
      if(dx < -58) setTimeout(onDelete, 60);
    }, {passive:true});
  }

        else if(act==="noshow"){ quickStatus(id,"noshow"); }
        else if(act==="snooze"){ c.meta = c.meta||{}; c.meta.callbackDate = isoShift(1); save(); render(); toast("перенесено на завтра"); }
        else if(act==="hired"){ quickStatus(id,"hired",{ startDate: isoToday() }); toast("вышел на работу"); }

        else if(act==="passed"){ openCand(id, "outcome"); }

    });
    var hok = document.getElementById("hintOk");

    var ti = document.getElementById("taskInput"), ta = document.getElementById("taskAdd");
    if(ta) ta.onclick = function(){
      var v = (ti.value||"").trim(); if(!v) return;

      ti.value=""; save(); render();
    };

    each(document.querySelectorAll("[data-toggle]"), function(el){

    each(document.querySelectorAll("[data-deltask]"), function(el){
      el.onclick = function(){ state.tasks = state.tasks.filter(function(t){ return t.id!==el.getAttribute("data-deltask"); }); save(); render(); };
    });
    each(document.querySelectorAll("#cf [data-f]"), function(el){
      el.onclick = function(){ candFilter = el.getAttribute("data-f"); render(); };
    });
    var cs = document.getElementById("candSearch");
    if(cs) cs.oninput = function(){ candSearch = cs.value; var pos = cs.selectionStart; render(); var n = document.getElementById("candSearch"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } };
    each(document.querySelectorAll("[data-rep]"), function(el){

  // ---- candidate editor ----
  function openCand(id, focusPart){

    var ref = c;
    if(isNew) c = { id:uid(), fio:"", vacancy:"", age:"", phone:"", exp:"", status:"new", meta:{}, note:"", history:[], createdAt:isoToday() };
    var draft = JSON.parse(JSON.stringify(c));

    function vacOptions(sel){
      var o = '<option value="">— вакансия —</option>';
      state.vacancies.forEach(function(v){ o += '<option value="'+v.id+'" '+(sel===v.id?"selected":"")+'>'+esc(v.title)+'</option>'; });
      return o;
    }
    function opt(v,sel){ return '<option value="'+esc(v)+'" '+(sel===v?"selected":"")+'>'+esc(v)+'</option>'; }
    function fld(l,inner){ return '<div class="field"><label>'+l+'</label>'+inner+'</div>'; }

        h += '<div class="field"><label>подтверждение</label><div class="seg"><button type="button" data-conf="1" class="'+(m.confirmed?"on":"")+'">подтверждён</button><button type="button" data-conf="0" class="'+(!m.confirmed?"on":"")+'">ждём</button></div></div>';
      } else if(s==="noshow"){

      var m = draft.meta||{};
      var opts = [["yes","подходит"],["maybe","сомнения"],["no","не подходит"]];
      return '<div class="field"><label>оценка после собеседования</label><div class="chips" id="rateChips">'+
        opts.map(function(o){ return '<button type="button" class="chip rate-'+o[0]+(m.rating===o[0]?" on":"")+'" data-rate="'+o[0]+'">'+o[1]+'</button>'; }).join("")+
        '</div><input data-m="verdict" value="'+esc(m.verdict||"")+'" placeholder="короткий вывод" style="margin-top:8px"></div>';
    }
    function fillRate(){
      var w = sheet.querySelector("#rateWrap"); if(!w) return;
      w.innerHTML = rateInner();
      each(sheet.querySelectorAll("#rateChips [data-rate]"), function(el){
        el.onclick = function(){
          draft.meta.rating = el.getAttribute("data-rate");
          each(sheet.querySelectorAll("#rateChips [data-rate]"), function(x){ x.classList.toggle("on", x===el); });
        };
      });
    }
    function rebuildCond(){
      readInputs();
      each(sheet.querySelectorAll("#stChips [data-st]"), function(x){ x.classList.toggle("on", x.getAttribute("data-st")===draft.status); });
      sheet.querySelector("#ocWrap").innerHTML = outcomeBlock();
      sheet.querySelector("#condWrap").innerHTML = condFields();
      wireCond();
      fillRate();
    }
    function wireCond(){
      each(sheet.querySelectorAll("[data-oc]"), function(el){
        el.onclick = function(){ draft.status = el.getAttribute("data-oc"); rebuildCond(); };
      });
      each(sheet.querySelectorAll("[data-conf]"), function(el){
        el.onclick = function(){
          draft.meta.confirmed = el.getAttribute("data-conf")==="1";
          each(sheet.querySelectorAll("[data-conf]"), function(x){ x.classList.toggle("on", x===el); });
        };
      });
      each(sheet.querySelectorAll("[data-mchip]"), function(el){
        el.onclick = function(){
          var p = el.getAttribute("data-mchip"), i = p.indexOf("|");
          var f = p.slice(0,i), val = p.slice(i+1);
          draft.meta[f] = val;
          var box = el.parentNode;
          each(box.querySelectorAll("[data-mchip]"), function(x){ x.classList.toggle("on", x===el); });
          var inp = box.parentNode.querySelector('[data-m="'+f+'"]');
          if(inp) inp.value = val;
        };
      });
    }
    function wireAll(){
      each(sheet.querySelectorAll("#stChips [data-st]"), function(el){
        el.onclick = function(){ readInputs(); draft.status = el.getAttribute("data-st"); rebuildCond(); };
      });
      each(sheet.querySelectorAll("#expSeg [data-exp]"), function(el){
        el.onclick = function(){
          draft.exp = el.getAttribute("data-exp");
          each(sheet.querySelectorAll("#expSeg [data-exp]"), function(x){ x.classList.toggle("on", x===el); });
        };
      });
      var av = sheet.querySelector("#addVacInline");
      if(av) av.onclick = function(){
        readInputs();
        var name = prompt("название вакансии");
        if(!name || !name.trim()) return;
        var v = { id:uid(), title:name.trim(), dept:"", need:1, createdAt:isoToday() };
        state.vacancies.push(v); save();
        draft.vacancy = v.id;
        sheet.innerHTML = '<div class="handle"></div>'+body();
        wireAll();
      };
      each(sheet.querySelectorAll("[data-tpl]"), function(el){
        el.onclick = function(){
          var tpl = state.refs.templates[parseInt(el.getAttribute("data-tpl"),10)];
          if(!tpl) return;
          readInputs();
          var m = draft.meta||{};
          var out = tpl.text
            .replace(/\{имя\}/g, (draft.fio||"").split(" ")[0] || draft.fio || "")
            .replace(/\{вакансия\}/g, vacTitle(draft.vacancy) || "")
            .replace(/\{дата\}/g, ruDate(m.interviewDate || m.medDate) || "")
            .replace(/\{время\}/g, m.interviewTime || "");
          copyText(out);
        };
      });
      wireCond();
      fillRate();
      sheet.querySelector("#saveCand").onclick = doSave;
      var d = sheet.querySelector("#delCand");
      if(d) d.onclick = doDelete;
    }

    function doSave(){
      readInputs();
      if(!draft.fio || !draft.fio.trim()){ alert("впиши имя"); return; }
      var prevStatus = ref ? ref.status : null;
      var prevRating = (ref && ref.meta) ? ref.meta.rating : null;
      draft.history = draft.history || [];
      if(isNew) draft.history.push({ date:isoToday(), to:draft.status, extra:"" });
      else if(draft.status !== prevStatus) draft.history.push({ date:isoToday(), to:draft.status, extra:condExtra(draft, draft.status) });
      if(draft.meta.rating && draft.meta.rating !== prevRating)
        draft.history.push({ date:isoToday(), label:"оценка: "+ratingName(draft.meta.rating)+(draft.meta.verdict?" — "+draft.meta.verdict:"") });
      if(isNew) state.candidates.push(draft);
      else state.candidates[state.candidates.indexOf(ref)] = draft;
      save(); closeSheet(); render();
    }
    function doDelete(){
      if(!confirm("удалить кандидата насовсем?")) return;
      state.candidates = state.candidates.filter(function(x){ return x.id!==draft.id; });
      save(); closeSheet(); render();
    }

    openSheet(body());
    wireAll();
    if(focusPart==="outcome"){
      var oc = sheet.querySelector(".outcome");
      if(oc) oc.scrollIntoView({block:"center"});
    }
  }

  // ---- vacancy editor ----
  function openVac(id){
    var v = id ? findVac(id) : null;
    var isNew = !v;
    if(isNew) v = { id:uid(), title:"", dept:"", need:1, deadline:"", createdAt:isoToday() };
    var d = JSON.parse(JSON.stringify(v));
    var h = '<h2>'+(isNew?"новая вакансия":"вакансия")+'</h2>';
    h += '<div class="field"><label>должность</label><input data-k="title" value="'+esc(d.title)+'" placeholder="например: продавец-кассир"></div>';
    h += '<div class="field"><label>отдел</label><input data-k="dept" value="'+esc(d.dept)+'" placeholder="необязательно"></div>';
    h += '<div class="field"><label>сколько человек нужно</label><input type="number" inputmode="numeric" data-k="need" value="'+esc(d.need)+'"></div>';
    h += '<div class="field"><label>дедлайн закрытия</label><input type="date" data-k="deadline" value="'+esc(d.deadline||"")+'"></div>';
    h += '<button class="btn" id="saveVac">сохранить</button>';
    if(!isNew) h += '<button class="btn ghost" id="delVac">удалить вакансию</button>';
    openSheet(h);
    sheet.querySelector("#saveVac").onclick = function(){
      each(sheet.querySelectorAll("[data-k]"), function(el){
        d[el.getAttribute("data-k")] = el.getAttribute("data-k")==="need" ? (parseInt(el.value,10)||0) : el.value;
      });
      if(!d.title || !d.title.trim()){ alert("впиши должность"); return; }
      if(isNew) state.vacancies.push(d);
      else state.vacancies[state.vacancies.indexOf(v)] = d;
      save(); closeSheet(); render();
    };
    var dv = sheet.querySelector("#delVac");
    if(dv) dv.onclick = function(){
      var used = state.candidates.filter(function(c){return c.vacancy===v.id;}).length;
      if(!confirm(used ? ("на эту вакансию заведено "+used+" чел. всё равно удалить?") : "удалить вакансию?")) return;
      state.vacancies = state.vacancies.filter(function(x){ return x.id!==v.id; });
      save(); closeSheet(); render();
    };
  }

  // ---- dismissal editor ----
  function openFired(id){
    var d = id ? findFired(id) : null;
    var isNew = !d;
    if(isNew) d = { id:uid(), fio:"", position:"", date:isoToday(), reason:"", hireDate:"" };
    var dr = JSON.parse(JSON.stringify(d));
    var h = '<h2>'+(isNew?"увольнение":"запись")+'</h2>';
    h += '<div class="field"><label>фио</label><input data-k="fio" value="'+esc(dr.fio)+'" placeholder="имя и фамилия"></div>';
    h += '<div class="field"><label>должность</label><input data-k="position" value="'+esc(dr.position)+'"></div>';
    h += '<div class="field"><label>дата приёма (необязательно)</label><input type="date" data-k="hireDate" value="'+esc(dr.hireDate||"")+'"></div>';
    h += '<div class="field"><label>дата увольнения</label><input type="date" data-k="date" value="'+esc(dr.date)+'"></div>';
    h += '<div class="field"><label>причина</label><div class="chips" id="dReasonChips">'+
         state.refs.dismiss.map(function(r){ return '<button type="button" class="chip'+(dr.reason===r?" on":"")+'" data-dr="'+esc(r)+'">'+esc(r)+'</button>'; }).join("")+
         '</div><input data-k="reason" value="'+esc(dr.reason)+'" placeholder="или впиши свою" style="margin-top:8px"></div>';
    h += '<div class="field muted" style="font-size:12px">месяц и срок работы посчитаются сами</div>';
    h += '<button class="btn" id="saveF">сохранить</button>';
    if(!isNew) h += '<button class="btn ghost" id="delF">удалить запись</button>';
    openSheet(h);
    each(sheet.querySelectorAll("#dReasonChips [data-dr]"), function(el){
      el.onclick = function(){
        var v = el.getAttribute("data-dr");
        each(sheet.querySelectorAll("#dReasonChips [data-dr]"), function(x){ x.classList.toggle("on", x===el); });
        sheet.querySelector('[data-k="reason"]').value = v;
      };
    });
    sheet.querySelector("#saveF").onclick = function(){
      each(sheet.querySelectorAll("[data-k]"), function(el){ dr[el.getAttribute("data-k")] = el.value; });
      if(!dr.fio || !dr.fio.trim()){ alert("впиши имя"); return; }
      dr.month = monthName(dr.date);
      dr.tenure = (dr.hireDate && dr.date) ? daysBetween(dr.hireDate, dr.date) : null;
      dr.probation = (dr.tenure!=null && dr.tenure>=0 && dr.tenure<=90);
      if(isNew) state.dismissals.push(dr);
      else state.dismissals[state.dismissals.indexOf(d)] = dr;
      save(); closeSheet(); render();
    };
    var df = sheet.querySelector("#delF");
    if(df) df.onclick = function(){
      if(!confirm("удалить запись?")) return;
      state.dismissals = state.dismissals.filter(function(x){ return x.id!==d.id; });
      save(); closeSheet(); render();
    };
  }

  // ---- settings ----
  function openSettings(){
    var h = '<h2>настройки</h2>';
    h += refBlock("причины отказа", "reject");
    h += refBlock("причины увольнения", "dismiss");
    h += '<div class="field"><label>шаблоны сообщений</label>';
    state.refs.templates.forEach(function(t,i){
      h += '<div class="disc"><span class="dtxt">'+esc(t.name)+'</span>'+
           '<button class="inline-add" data-tpledit="'+i+'">изменить</button>'+
           '<button class="chev" data-tpldel="'+i+'" style="background:none;border:none;font-size:17px">×</button></div>';
    });
    h += '<button class="inline-add" data-tpledit="new">+ добавить шаблон</button></div>';
    h += '<div class="field"><label>всё сразу</label>'+
         '<button class="btn soft" id="sExp">выгрузить копию данных</button>'+
         '<button class="btn soft" id="sImp" style="margin-top:8px">загрузить из копии</button>'+
         '<input type="file" id="sImpFile" accept="application/json,.json" style="display:none">'+
         '<button class="btn ghost" id="sClear" style="margin-top:14px">очистить все данные</button></div>';
    openSheet(h);
    each(sheet.querySelectorAll("[data-refadd]"), function(el){
      el.onclick = function(){
        var k = el.getAttribute("data-refadd");
        var inp = sheet.querySelector('[data-refinput="'+k+'"]');
        var v = (inp.value||"").trim(); if(!v) return;
        state.refs[k].push(v); inp.value=""; save(); openSettings();
      };
    });
    each(sheet.querySelectorAll("[data-refdel]"), function(el){
      el.onclick = function(){ var p = el.getAttribute("data-refdel").split("|"); state.refs[p[0]].splice(parseInt(p[1],10),1); save(); openSettings(); };
    });
    each(sheet.querySelectorAll("[data-tpledit]"), function(el){
      el.onclick = function(){ editTemplate(el.getAttribute("data-tpledit")); };
    });
    each(sheet.querySelectorAll("[data-tpldel]"), function(el){
      el.onclick = function(){ if(confirm("удалить шаблон?")){ state.refs.templates.splice(parseInt(el.getAttribute("data-tpldel"),10),1); save(); openSettings(); } };
    });
    sheet.querySelector("#sExp").onclick = doExport;
    sheet.querySelector("#sImp").onclick = function(){ sheet.querySelector("#sImpFile").click(); };
    sheet.querySelector("#sImpFile").onchange = doImport;
    sheet.querySelector("#sClear").onclick = function(){
      if(!confirm("удалить все данные из этого браузера? отменить нельзя")) return;
      if(!confirm("точно? сделай копию заранее")) return;
      localStorage.removeItem(KEY); state = load(); closeSheet(); setScreen("day");
    };
  }
  function editTemplate(idx){
    var isNew = (idx==="new");
    var t = isNew ? {name:"",text:""} : state.refs.templates[parseInt(idx,10)];
    var d = { name:t.name, text:t.text };
    var h = '<h2>'+(isNew?"новый шаблон":"шаблон")+'</h2>';
    h += '<div class="field"><label>название</label><input data-k="name" value="'+esc(d.name)+'" placeholder="например: приглашение"></div>';
    h += '<div class="field"><label>текст</label><textarea data-k="text" style="min-height:120px">'+esc(d.text)+'</textarea>'+
         '<div class="muted" style="font-size:12px;margin-top:6px">подставляются сами: {имя}, {вакансия}, {дата}, {время}</div></div>';
    h += '<button class="btn" id="tplSave">сохранить</button>';
    openSheet(h);
    sheet.querySelector("#tplSave").onclick = function(){
      each(sheet.querySelectorAll("[data-k]"), function(el){ d[el.getAttribute("data-k")] = el.value; });
      if(!d.name.trim()){ alert("впиши название"); return; }
      if(isNew) state.refs.templates.push(d);
      else state.refs.templates[parseInt(idx,10)] = d;
      save(); openSettings();
    };
  }
  function refBlock(title,k){
    var h = '<div class="field"><label>'+title+'</label>';
    state.refs[k].forEach(function(r,i){
      h += '<div class="disc"><span class="dtxt">'+esc(r)+'</span><button class="chev" data-refdel="'+k+'|'+i+'" style="background:none;border:none;font-size:17px">×</button></div>';
    });
    h += '<div class="addrow" style="margin-top:8px"><input data-refinput="'+k+'" placeholder="добавить"><button data-refadd="'+k+'">+</button></div></div>';
    return h;
  }

  // ---- export / import ----
  function doExport(){
    try{
      var blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "найм-копия-"+isoToday()+".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 8000);
    }catch(e){ alert("не удалось выгрузить"); }
  }
  function doImport(e){
    var f = e.target.files && e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var s = JSON.parse(r.result);
        if(!s || !s.candidates){ alert("файл не похож на копию"); return; }
        if(!confirm("заменить текущие данные данными из файла?")) return;
        localStorage.setItem(KEY, JSON.stringify(s));
        state = load(); closeSheet(); setScreen("day");
      }catch(err){ alert("не получилось прочитать файл"); }
    };
    r.readAsText(f);
  }

  // ================= NAV / FAB =================
  each(document.querySelectorAll("#nav button"), function(b){
    b.onclick = function(){ candFilter="all"; candSearch=""; setScreen(b.getAttribute("data-s")); };
  });
  document.getElementById("fab").onclick = function(){
    if(screen==="cands" || screen==="day") openCand(null);
    else if(screen==="vacs") openVac(null);
    else if(screen==="fired") openFired(null);
  };
  document.getElementById("gearBtn").onclick = openSettings;
  document.getElementById("themeBtn").onclick = function(){ setTheme(effectiveTheme()==="dark" ? "light" : "dark"); };
  updateThemeBtn();

  (function(){
    var d = new Date();
    var wd = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"][d.getDay()];
    document.getElementById("today").textContent = wd + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
  })();

  setScreen("day");

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
      var reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", function(){
        if(reloaded) return; reloaded = true; location.reload();
      });
    });
  }
})();
</script>
</body>
</html>
